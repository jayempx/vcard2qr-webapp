name: Verify and promote
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qrstudio
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: qrstudio
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U qrstudio" --health-interval 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-0000000000
      ACCESS_CODE: "012345"
      DEBUG: "1"
      POSTGRES_DB: qrstudio
      POSTGRES_USER: qrstudio
      POSTGRES_PASSWORD: ci-only-password
      DB_HOST: "127.0.0.1"
      PUBLIC_BASE_URL: https://qr.example.com
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver,qr.example.com
      PROXY_NETWORK: ci-proxy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.lock -r requirements-test.txt
      - run: python scripts/check_public_data.py --history
      - run: ruff check . && ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput --verbosity 0
      - run: python manage.py test --verbosity 1
      - name: Build tested source
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -t qr-studio-ci .
      - name: Production smoke test
        run: |
          docker run -d --name qr-smoke --network host -e SECRET_KEY -e ACCESS_CODE -e POSTGRES_PASSWORD -e DB_HOST -e PUBLIC_BASE_URL -e ALLOWED_HOSTS -e TRUST_PROXY=1 -e DEBUG=0 qr-studio-ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/health/ > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/health/
          docker exec qr-smoke python manage.py check --deploy --fail-level WARNING
          docker exec qr-smoke python manage.py backup_data
          docker exec -e ALLOW_RESTORE_TEST=1 qr-smoke python scripts/restore_check.py
          docker compose -f compose.portainer.yml pull --ignore-buildable
      - name: Smoke logs on failure
        if: failure()
        run: docker logs --tail 40 qr-smoke 2>/dev/null || true
  promote:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote verified source
        run: |
          python scripts/promote.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add compose.portainer.yml
          git diff --cached --quiet && exit 0
          git commit -m "Promote verified source"
          git push origin HEAD:main
